<!-- ===== Ask Olukunle AI Chat Widget ===== -->
<style>
  #ask-olukunle-btn {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #111; color: #fff; border: none;
    font-size: 24px; cursor: pointer; z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    transition: transform 0.2s;
  }
  #ask-olukunle-btn:hover { transform: scale(1.08); }

  #ask-olukunle-panel {
    display: none;
    position: fixed; bottom: 96px; right: 24px;
    width: 360px; max-width: calc(100vw - 32px);
    height: 480px; max-height: calc(100vh - 120px);
    background: #fff; border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    z-index: 9999; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #ask-olukunle-panel.open { display: flex; }

  #ask-olukunle-header {
    background: #111; color: #fff;
    padding: 16px; font-weight: 600; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #ask-olukunle-header button {
    background: none; border: none; color: #fff;
    font-size: 20px; cursor: pointer;
  }

  #ask-olukunle-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: #f7f7f8;
  }

  .ask-msg { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
  .ask-msg.user { background: #111; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .ask-msg.bot { background: #fff; color: #111; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .ask-msg.typing { color: #888; font-style: italic; }

  #ask-olukunle-form {
    display: flex; padding: 12px; gap: 8px;
    background: #fff; border-top: 1px solid #eee;
  }
  #ask-olukunle-input {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd;
    border-radius: 20px; font-size: 14px; outline: none;
  }
  #ask-olukunle-input:focus { border-color: #111; }
  #ask-olukunle-form button {
    background: #111; color: #fff; border: none;
    padding: 10px 18px; border-radius: 20px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  #ask-olukunle-form button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* MOBILE FIX — full screen chat on phones, does NOT cover content when closed */
  @media (max-width: 600px) {
    #ask-olukunle-btn {
      bottom: 16px; right: 16px;
      width: 52px; height: 52px;
      font-size: 22px;
    }
    #ask-olukunle-panel.open {
      bottom: 0 !important; right: 0 !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      max-width: 100vw !important; max-height: 100vh !important;
      border-radius: 0 !important;
    }
  }
</style>

<button id="ask-olukunle-btn" aria-label="Ask Olukunle">💬</button>

<div id="ask-olukunle-panel">
  <div id="ask-olukunle-header">
    <span>Ask Olukunle</span>
    <button type="button" onclick="document.getElementById('ask-olukunle-panel').classList.remove('open')">×</button>
  </div>
  <div id="ask-olukunle-messages">
    <div class="ask-msg bot">Hi! I'm Olukunle's AI assistant. Ask me anything about him — his work, projects, background, or interests.</div>
  </div>
  <form id="ask-olukunle-form">
    <input id="ask-olukunle-input" type="text" placeholder="Ask a question..." autocomplete="off" required />
    <button type="submit" id="ask-olukunle-send">Send</button>
  </form>
</div>

<script>
  (function() {
    const btn = document.getElementById('ask-olukunle-btn');
    const panel = document.getElementById('ask-olukunle-panel');
    const form = document.getElementById('ask-olukunle-form');
    const input = document.getElementById('ask-olukunle-input');
    const send = document.getElementById('ask-olukunle-send');
    const messages = document.getElementById('ask-olukunle-messages');
    const WORKER_URL = 'https://ask-olukunle-ai.ask-olukunle-ai.workers.dev';

    btn.addEventListener('click', () => {
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) input.focus();
    });

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = 'ask-msg ' + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, 'user');
      input.value = '';
      send.disabled = true;

      const typing = addMessage('Thinking...', 'bot typing');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question })
        });
        const data = await res.json();
        typing.remove();
        addMessage(data.response || data.error || "Sorry, I couldn't get a response.", 'bot');
      } catch (err) {
        typing.remove();
        addMessage("Sorry, something went wrong. Please try again.", 'bot');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  })();
</script>
<!-- ===== End Ask Olukunle AI Chat Widget ===== -->
